const SR = 48000;

      bp.connect(g); g.connect(drumG); const sv = ctx.createGain(); sv.gain.value = 0.4; g.connect(sv).connect(verb); noise(ctx, t, 0.22, bp);
      const o = ctx.createOscillator(); o.frequency.value = 185; const og = ctx.createGain(); og.gain.setValueAtTime(0.25, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.08); o.connect(og).connect(drumG); o.start(t); o.stop(t + 0.1);
    }

// ---------------- sfx ----------------
async function renderSfx(kind) {
